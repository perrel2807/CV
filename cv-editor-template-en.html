<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CV Editor — EN</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e2e;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #13131f;
      color: #cdd6f4;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.05em; }

    button {
      padding: 6px 16px;
      background: #89b4fa;
      color: #1e1e2e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }
    button:hover { background: #74c7ec; }

    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-pane { width: 50%; border-right: 1px solid #313244; }
    .preview-pane { flex: 1; }

    .pane-label {
      padding: 5px 12px;
      background: #181825;
      color: #585b70;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    .cm-wrapper {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .CodeMirror {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      height: 100%;
      font-size: 13px;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      line-height: 1.6;
    }

    iframe {
      flex: 1;
      border: none;
      background: white;
    }

    .resizer {
      width: 5px;
      background: #313244;
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s;
      position: relative;
      z-index: 10;
    }
    .resizer:hover, .resizer.dragging { background: #89b4fa; }
  </style>
</head>
<body>

  <header>
    <h1>CV Editor — EN</h1>
    <button onclick="exportCV()">⬇ Export CV</button>
  </header>

  <div class="workspace">
    <div class="pane editor-pane" id="editorPane">
      <div class="pane-label">HTML Code</div>
      <div class="cm-wrapper">
        <textarea id="editor"></textarea>
      </div>
    </div>
    <div class="resizer" id="resizer"></div>
    <div class="pane preview-pane">
      <div class="pane-label">Live Preview</div>
      <iframe id="preview"></iframe>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

  <script>

    // ── Init CodeMirror ──
    const cm = CodeMirror.fromTextArea(document.getElementById('editor'), {
      mode: 'htmlmixed',
      theme: 'dracula',
      lineNumbers: true,
      autoCloseTags: true,
      autoCloseBrackets: true,
      lineWrapping: true,
      tabSize: 2,
      indentWithTabs: false,
    });

    cm.setValue(initialCV);
    cm.setSize('100%', '100%');

    // ── Live preview ──
    function updatePreview() {
      const iframe = document.getElementById('preview');
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(cm.getValue());
      doc.close();
    }

    cm.on('change', updatePreview);
    updatePreview();

    // ── Resizer ──
    const resizer = document.getElementById('resizer');
    const editorPane = document.getElementById('editorPane');
    const workspace = document.querySelector('.workspace');
    let isResizing = false;

    resizer.addEventListener('mousedown', () => {
      isResizing = true;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const rect = workspace.getBoundingClientRect();
      const pct = Math.min(Math.max((e.clientX - rect.left) / rect.width * 100, 20), 80);
      editorPane.style.width = pct + '%';
    });

    document.addEventListener('mouseup', () => {
      isResizing = false;
      resizer.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });

    // ── Export ──
    function exportCV() {
      const blob = new Blob([cm.getValue()], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'cv-en.html';
      a.click();
    }
  </script>

</body>
</html>
