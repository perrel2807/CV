<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CV Editor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e2e;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #13131f;
      color: #cdd6f4;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.05em; }

    button {
      padding: 6px 16px;
      background: #89b4fa;
      color: #1e1e2e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }
    button:hover { background: #74c7ec; }

    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-pane { width: 50%; border-right: 1px solid #313244; }
    .preview-pane { flex: 1; }

    .pane-label {
      padding: 5px 12px;
      background: #181825;
      color: #585b70;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    .cm-wrapper {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .CodeMirror {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      height: 100%;
      font-size: 13px;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      line-height: 1.6;
    }

    iframe {
      flex: 1;
      border: none;
      background: white;
    }

    .resizer {
      width: 5px;
      background: #313244;
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s;
      position: relative;
      z-index: 10;
    }
    .resizer:hover, .resizer.dragging { background: #89b4fa; }
  </style>
</head>
<body>

  <header>
    <h1>CV Editor</h1>
    <button onclick="exportCV()">⬇ Exporter le CV</button>
  </header>

  <div class="workspace">
    <div class="pane editor-pane" id="editorPane">
      <div class="pane-label">Code HTML</div>
      <div class="cm-wrapper">
        <textarea id="editor"></textarea>
      </div>
    </div>
    <div class="resizer" id="resizer"></div>
    <div class="pane preview-pane">
      <div class="pane-label">Aperçu en temps réel</div>
      <iframe id="preview"></iframe>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

  <script>
    const initialCV = `<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon CV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #f5f5f0;
      color: #2c2c2c;
      padding: 40px 20px;
    }

    .cv {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 50px 60px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    /* ── EN-TÊTE ── */
    .header {
      border-bottom: 2px solid #2c2c2c;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 32px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header .titre {
      font-size: 15px;
      color: #666;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .header .contact {
      margin-top: 12px;
      font-size: 13px;
      color: #444;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* ── SECTIONS ── */
    .section {
      margin-bottom: 28px;
    }

    .section h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #999;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 6px;
      margin-bottom: 16px;
    }

    /* ── ITEMS ── */
    .item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .item-left { flex: 1; }

    .item-title {
      font-weight: bold;
      font-size: 14px;
    }

    .item-sub {
      color: #666;
      font-size: 13px;
      margin-top: 2px;
      font-style: italic;
    }

    .item-desc {
      color: #444;
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.6;
    }

    .item-date {
      font-size: 12px;
      color: #aaa;
      white-space: nowrap;
      margin-left: 24px;
      margin-top: 2px;
    }

    /* ── COMPÉTENCES ── */
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill {
      background: #f0f0ec;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="cv">

    <!-- EN-TÊTE -->
    <div class="header">
      <h1>Prénom Nom</h1>
      <div class="titre">Intitulé du poste</div>
      <div class="contact">
        <span>email@exemple.com</span>
        <span>+33 6 00 00 00 00</span>
        <span>Paris, France</span>
        <span>linkedin.com/in/profil</span>
      </div>
    </div>

    <!-- EXPÉRIENCE -->
    <div class="section">
      <h2>Expérience</h2>

      <div class="item">
        <div class="item-left">
          <div class="item-title">Titre du poste</div>
          <div class="item-sub">Nom de l'entreprise</div>
          <div class="item-desc">Description de vos missions et réalisations clés.</div>
        </div>
        <div class="item-date">2023 — présent</div>
      </div>

      <div class="item">
        <div class="item-left">
          <div class="item-title">Titre du poste</div>
          <div class="item-sub">Nom de l'entreprise</div>
          <div class="item-desc">Description de vos missions et réalisations clés.</div>
        </div>
        <div class="item-date">2021 — 2023</div>
      </div>
    </div>

    <!-- FORMATION -->
    <div class="section">
      <h2>Formation</h2>

      <div class="item">
        <div class="item-left">
          <div class="item-title">Diplôme</div>
          <div class="item-sub">Établissement</div>
        </div>
        <div class="item-date">2021</div>
      </div>
    </div>

    <!-- COMPÉTENCES -->
    <div class="section">
      <h2>Compétences</h2>
      <div class="skills">
        <span class="skill">HTML / CSS</span>
        <span class="skill">JavaScript</span>
        <span class="skill">Compétence 3</span>
        <span class="skill">Compétence 4</span>
        <span class="skill">Compétence 5</span>
      </div>
    </div>

  </div>
</body>
</html>`;

    // ── Init CodeMirror ──
    const cm = CodeMirror.fromTextArea(document.getElementById('editor'), {
      mode: 'htmlmixed',
      theme: 'dracula',
      lineNumbers: true,
      autoCloseTags: true,
      autoCloseBrackets: true,
      lineWrapping: true,
      tabSize: 2,
      indentWithTabs: false,
    });

    cm.setValue(initialCV);
    cm.setSize('100%', '100%');

    // ── Live preview ──
    function updatePreview() {
      const iframe = document.getElementById('preview');
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(cm.getValue());
      doc.close();
    }

    cm.on('change', updatePreview);
    updatePreview();

    // ── Resizer ──
    const resizer = document.getElementById('resizer');
    const editorPane = document.getElementById('editorPane');
    const workspace = document.querySelector('.workspace');
    let isResizing = false;

    resizer.addEventListener('mousedown', () => {
      isResizing = true;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const rect = workspace.getBoundingClientRect();
      const pct = Math.min(Math.max((e.clientX - rect.left) / rect.width * 100, 20), 80);
      editorPane.style.width = pct + '%';
    });

    document.addEventListener('mouseup', () => {
      isResizing = false;
      resizer.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });

    // ── Export ──
    function exportCV() {
      const blob = new Blob([cm.getValue()], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'cv.html';
      a.click();
    }
  </script>

</body>
</html>
